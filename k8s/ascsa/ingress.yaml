apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ascsa
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
  - host: asd.com.tr
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ascsa
            port:
              number: 80
